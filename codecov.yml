codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 80%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

flags:
  unittests:
    paths:
      - "*.go"
    carryforward: true

ignore:
  - "**/*_test.go"
  - "docs/"
  - "scripts/"
  - "tmp/"
